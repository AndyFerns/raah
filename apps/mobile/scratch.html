<!DOCTYPE html><html><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" /><style>* {margin: 0;padding: 0;}html,body,#map {width: 100%;height: 100%;overflow: hidden;background: #0a0f1a;}.user-location-wrapper {width: 44px;height: 44px;display: flex;align-items: center;justify-content: center;border-radius: 50%;background: rgba(59, 130, 246, 0.15);box-shadow: 0 0 0 8px rgba(59, 130, 246, 0.08), 0 0 25px rgba(59, 130, 246, 0.5);}.user-location-dot {width: 18px;height: 18px;background: #3b82f6;border: 4px solid white;border-radius: 50%;box-sizing: border-box;box-shadow: 0 0 12px rgba(59, 130, 246, 1);}</style></head><body><div id="map"></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>const userLongitude = 72.9986;const userLatitude = 19.155;const map = new maplibregl.Map({container: "map",style: "https://api.maptiler.com/maps/streets-v2-dark/style.json?key=ggEIqrTuOwyx948Fu5aa",center: [userLongitude,userLatitude],zoom: 16,pitch: 60,bearing: -20,antialias: true});map.addControl(new maplibregl.NavigationControl(),"top-right");map.on("load", () => {const markerElement = document.createElement("div");markerElement.className = "user-location-wrapper";const dot = document.createElement("div");dot.className = "user-location-dot";markerElement.appendChild(dot);new maplibregl.Marker({element: markerElement,anchor: "center"}).setLngLat([userLongitude,userLatitude]).addTo(map);});</script></body></html>
